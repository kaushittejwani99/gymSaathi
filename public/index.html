<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="__BUILD__">
  <title>GymSaathi - Run your gym by talking</title>
  <meta name="description" content="GymSaathi: gym memberships, fees and WhatsApp reminders, run by voice.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth">
  <svg hidden>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2M16 4v4M8 10v4M16 16v4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 9v6M18 9v6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/></symbol>
  </svg>

  <header class="topbar">
    <button class="btn ghost icon" data-action="nav-toggle" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <span class="wordmark"><img class="mark" src="/favicon.svg" alt="" width="24" height="24">GymSaathi</span>
    <span class="tagline">Run your gym by talking</span>
  </header>
  <div class="scrim" data-action="nav-toggle"></div>

  <aside class="sidebar">
    <a class="wordmark" href="#/dashboard"><img class="mark" src="/favicon.svg" alt="" width="24" height="24">GymSaathi</a>
    <p class="tagline">Run your gym by talking</p>
    <nav aria-label="Main">
      <a href="#/dashboard"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Dashboard</a>
      <a href="#/bolo"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>Assistant</a>
      <a href="#/members"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Members</a>
      <a href="#/payments"><svg class="icon" aria-hidden="true"><use href="#i-cash"/></svg>Payments</a>
      <a href="#/settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>Settings</a>
      <a href="#/accounts" id="navAccounts" hidden><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Accounts</a>
    </nav>
    <div class="side-foot">
      <div id="gymName" class="biz-name"></div>
      <div id="planNote" class="hint plan-note"></div>
      <button class="btn ghost" data-action="view-close" id="viewClose" hidden>Back to all gyms</button>
      <button class="btn ghost" data-action="logout" id="signOut">Sign out</button>
    </div>
  </aside>

  <main id="main"><p class="muted">Loading&hellip;</p></main>

  <dialog id="dialog"></dialog>
  <div id="toasts" popover="manual" aria-live="polite"></div>
  <div id="loading" role="progressbar" aria-label="Working"></div>

  <script src="/lib/core.js"></script>
  <script src="/app.js"></script>
</body>
</html>
